name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Tezlik: JS va CSS saytga siqilgan holda chiqadi (repodagi manba o'zgarmaydi).
      # Fayllar alohida qoladi (birlashtirilmaydi) — biri xato bersa boshqalari ishlayveradi.
      - name: JS va CSS'ni siqish
        run: |
          before=$(cat yoldosh/js/*.js yoldosh/css/*.css | wc -c)
          npx --yes esbuild@0.24.0 yoldosh/js/*.js --minify-whitespace --minify-syntax --outdir=yoldosh/js --allow-overwrite --charset=utf8 --legal-comments=none --log-level=warning
          npx --yes esbuild@0.24.0 yoldosh/css/*.css --minify --outdir=yoldosh/css --allow-overwrite --charset=utf8 --log-level=warning
          for f in yoldosh/js/*.js; do node --check "$f" || { echo "::error::$f siqilgandan keyin buzildi"; exit 1; }; done
          after=$(cat yoldosh/js/*.js yoldosh/css/*.css | wc -c)
          echo "JS+CSS: $((before/1024)) KB -> $((after/1024)) KB"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yoldosh
      - id: deployment
        uses: actions/deploy-pages@v4
