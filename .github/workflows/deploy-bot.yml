name: Deploy bot (Cloudflare Worker)
# yoldosh/server/ ichidagi har bir o'zgarish main ga tushganda bot avtomatik Cloudflare'ga yuklanadi.
# Kerakli sirlar (GitHub: Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare "Edit Cloudflare Workers" shabloni bilan yaratilgan token
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare hisob ID si
# Sirlar qo'shilmagan bo'lsa, yuklash o'tkazib yuboriladi (xatolik bermaydi).
on:
  push:
    branches: [main]
    paths: ['yoldosh/server/**']
  workflow_dispatch:
concurrency:
  group: worker-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Sirlar bormi?
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN va CLOUDFLARE_ACCOUNT_ID sirlari qo'shilmagan, bot yuklanmadi"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Testlar
        if: steps.cfg.outputs.ready == 'true'
        working-directory: yoldosh/server
        run: |
          node worker.test.mjs
          node --experimental-sqlite worker.db.test.mjs
      - name: Cloudflare'ga yuklash
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: yoldosh/server
          command: deploy
