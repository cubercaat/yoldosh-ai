name: Baza zaxirasi (D1)
# Har kuni tunda Cloudflare D1 bazasini to'liq eksport qiladi, PAROL bilan shifrlaydi va 30 kun saqlaydi.
# Repo ochiq bo'lgani uchun zaxira faqat shifrlangan holda yuklanadi — parolsiz uni hech kim o'qiy olmaydi.
#
# Kerakli sirlar (GitHub: Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  — bot yuklashdagi token (ruxsatlarida "D1: Edit" bo'lishi kerak)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare hisob ID si
#   BACKUP_PASSPHRASE     — zaxirani shifrlash paroli (uzun, o'zingiz o'ylab toping va xavfsiz joyda saqlang)
#
# Tiklash:  gpg -d chorraha-YYYY-MM-DD.sql.gz.gpg | gunzip > db.sql
#           npx wrangler d1 execute chorraha --remote --file=db.sql   (yangi/bo'sh bazaga)
# Qo'shimcha: D1 o'zi ham "Time Travel" orqali so'nggi kunlarga qaytara oladi:
#           npx wrangler d1 time-travel restore chorraha --timestamp=2026-11-10T12:00:00Z
on:
  schedule:
    - cron: '17 21 * * *'   # har kuni Toshkent vaqti 02:17
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Sirlar bormi?
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID yoki BACKUP_PASSPHRASE qo'shilmagan — zaxira olinmadi"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22 }
      - name: Eksport va shifrlash
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set -euo pipefail
          D=$(date -u +%F)
          npx --yes wrangler@3 d1 export chorraha --remote --output=db.sql
          test -s db.sql
          gzip -9 db.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "chorraha-$D.sql.gz.gpg" db.sql.gz
          rm -f db.sql.gz
          ls -la chorraha-*.gpg
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: db-backup
          path: chorraha-*.sql.gz.gpg
          retention-days: 30
